<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">
  <defs>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f7"/>
      <stop offset=".55" stop-color="#b8c3ca"/>
      <stop offset="1" stop-color="#6f7a84"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25313c"/>
      <stop offset="1" stop-color="#0c1218"/>
    </linearGradient>
    <radialGradient id="visor" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#b8f6ff"/>
      <stop offset=".42" stop-color="#29c9f4"/>
      <stop offset="1" stop-color="#075576"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="60" cy="126" rx="27" ry="8" fill="#000" opacity=".28"/>

  <!-- legs / boots -->
  <path d="M42 87 L54 87 L51 116 L38 124 L32 117 L39 104 Z" fill="url(#armor)" stroke="#17212a" stroke-width="3"/>
  <path d="M66 87 L78 87 L81 104 L88 117 L82 124 L69 116 Z" fill="url(#armor)" stroke="#17212a" stroke-width="3"/>
  <path d="M31 115 L43 117 L41 130 L28 129 Z" fill="#1a252e" stroke="#080d12" stroke-width="3"/>
  <path d="M77 117 L89 115 L92 129 L79 130 Z" fill="#1a252e" stroke="#080d12" stroke-width="3"/>

  <!-- torso / pelvis -->
  <path d="M36 55 Q60 43 84 55 L79 92 Q60 103 41 92 Z" fill="url(#armor)" stroke="#15202a" stroke-width="4"/>
  <path d="M44 66 L76 66 L73 84 Q60 91 47 84 Z" fill="#2d3b47" stroke="#0b1117" stroke-width="2"/>
  <rect x="48" y="76" width="24" height="8" rx="3" fill="#0e1720"/>
  <rect x="54" y="77" width="12" height="4" rx="2" fill="#39d9ff" filter="url(#glow)"/>

  <!-- shoulders / arms -->
  <path d="M37 58 Q24 60 20 74 L25 82 L40 72 Z" fill="url(#armor)" stroke="#15202a" stroke-width="3"/>
  <path d="M83 58 Q96 60 100 74 L95 82 L80 72 Z" fill="url(#armor)" stroke="#15202a" stroke-width="3"/>
  <path d="M25 80 L38 74 L45 88 L33 95 Z" fill="#7b8790" stroke="#17212a" stroke-width="3"/>
  <path d="M95 80 L82 74 L75 88 L87 95 Z" fill="#7b8790" stroke="#17212a" stroke-width="3"/>

  <!-- helmet FRONT -->
  <circle cx="60" cy="42" r="25" fill="url(#armor)" stroke="#111b23" stroke-width="4"/>
  <path d="M39 35 Q60 20 81 35 Q80 55 60 61 Q40 55 39 35 Z" fill="url(#visor)" stroke="#072c3d" stroke-width="4" filter="url(#glow)"/>
  <path d="M43 28 Q60 17 77 28" fill="none" stroke="#fff" stroke-width="3" opacity=".55"/>
  <circle cx="34" cy="43" r="5" fill="#2c3945" stroke="#0a1015" stroke-width="2"/>
  <circle cx="86" cy="43" r="5" fill="#2c3945" stroke="#0a1015" stroke-width="2"/>

  <!-- weapon aimed DOWN -->
  <rect x="56" y="83" width="8" height="34" rx="3" fill="#1b242c" stroke="#070b0f" stroke-width="2"/>
  <rect x="53" y="96" width="14" height="15" rx="3" fill="#59656f" stroke="#111820" stroke-width="2"/>
  <rect x="57" y="113" width="6" height="15" rx="2" fill="#c98924" stroke="#402607" stroke-width="2"/>
  <circle cx="60" cy="127" r="3.5" fill="#ffd271" filter="url(#glow)"/>
</svg>