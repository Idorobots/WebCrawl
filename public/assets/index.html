<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WEBCRAWL assets</title>
  <style>
    body { font: 14px system-ui; background: #101c2b; color: #dff; margin: 24px; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .card { background: #455365; color: inherit; padding: 10px; text-decoration: none; }
    .card img { width: 100%; height: 200px; object-fit: contain; image-rendering: pixelated; }
    .card span { display: block; overflow-wrap: anywhere; }
    input { padding: 12px; }
    a { color: #78d3ff; }
  </style>
</head>
<body>
  <h1>WEBCRAWL assets</h1>
  <p><a href="README.md">Import guide</a> | <a href="manifest.json">Manifest</a></p>
  <input id="q" placeholder="Filter sprites" aria-label="Filter sprites">
  <main id="assets"></main>
  <script type="module">
    const manifest = await fetch("manifest.json").then(response => response.json());
    const root = document.querySelector("#assets");
    for (const [id, asset] of Object.entries(manifest.assets)) {
      const source = asset.path.replace(/^assets\//, "");
      const card = document.createElement("a");
      card.className = "card";
      card.href = source;
      card.dataset.name = id;
      const image = document.createElement("img");
      image.loading = "lazy";
      image.src = source;
      image.alt = "";
      const label = document.createElement("span");
      label.textContent = id;
      card.append(image, label);
      root.append(card);
    }
    document.querySelector("#q").addEventListener("input", event => {
      const query = event.target.value.toLowerCase();
      document.querySelectorAll(".card").forEach(card => {
        card.hidden = !card.dataset.name.toLowerCase().includes(query);
      });
    });
  </script>
</body>
</html>
